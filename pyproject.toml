[project]
name = "mokioclaw-stage1"
version = "0.1.0"
description = "MokioClaw — planner→verifier multi-agent CodeAgent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.2.0",
    "langchain-openai>=1.1.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.1.0",
    "tavily-python>=0.7.0",
    "typer>=0.16.0",
    "rich>=13.0.0",
]

[project.scripts]
mokioclaw = "mokioclaw.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mokioclaw"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
